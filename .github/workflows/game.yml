name: 遊戲建置與回歸
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 型別、單元測試與正式建置
        run: npm run check
      - name: 安裝測試瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 正式建置的瀏覽器回歸
        run: npm run test:browser
      - name: 保存瀏覽器結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          retention-days: 14
